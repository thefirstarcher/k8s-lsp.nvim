[workspace]
resolver = "2"
members = [
    "crates/k8s-lsp-server",
    "crates/k8s-lsp-core",
    "crates/k8s-lsp-parser",
    "crates/k8s-lsp-schema",
    "crates/k8s-lsp-cluster",
]
# `fuzz/` is a separate cargo-fuzz crate (requires nightly + libFuzzer) and
# must stay out of the default workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "signal"] }
tokio-util = "0.7"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
